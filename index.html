<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Deep Ocean Aquarium by Hinz</title>

    <style>
        /* =====================================================
   RESET
===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            background: #111;
            display: flex;
            justify-content: center;
            overflow-x: hidden;
        }


        /* =====================================================
   KHUNG TRANG
===================================================== */

        #cuon {
            width: 96vw;
            min-height: 100vh;
            background: #000;
            overflow-y: auto;
            overflow-x: hidden;
            box-shadow: 0 0 30px rgba(0, 0, 0, .7);
        }


        /* =====================================================
   CONTROL PANEL
===================================================== */

        #control-panel {
            width: 100%;
            min-height: 23.33vh;

            display: flex;
            justify-content: flex-end;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 10px;

            padding: 20px;

            background: #111;
        }

        #control-panel button {
            padding: 10px 16px;

            border: 2px solid #5ddcff;
            border-radius: 10px;

            background: #176b91;
            color: white;

            font-size: 15px;
            cursor: pointer;

            transition: .2s;
        }

        #control-panel button:hover {
            background: #238bb5;
            transform: translateY(-2px);
        }


        /* Nút âm thanh */

        #musicBtn {
            padding: 12px 20px !important;
            background: #075985 !important;
            border: 0 !important;
            font-size: 16px !important;
        }


        /* Nút cho cá ăn */

        #foodBtn {
            border-color: #ffd966 !important;
            background: #d99a16 !important;
        }

        #foodBtn:hover {
            background: #f0b429 !important;
        }

        #foodBtn.active {
            background: #f0b429 !important;
            box-shadow:
                0 0 12px rgba(255, 217, 102, .8);
        }


        /* =====================================================
   HỒ CÁ
===================================================== */

        #aquarium {
            position: relative;

            width: 96%;
            height: 100vh;

            margin: auto;

            overflow: hidden;

            border: 12px solid #9de8ff;
            border-radius: 22px;

            box-shadow:
                0 0 0 4px rgba(255, 255, 255, .25),
                0 0 30px rgba(0, 180, 255, .5),
                inset 0 0 25px rgba(255, 255, 255, .2);
        }


        /* =====================================================
   BACKGROUND
===================================================== */

        .tank-bg {
            position: absolute;
            inset: 0;

            background-image: url("images/bg1.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            z-index: 0;
        }


        /* =====================================================
   CÁT
===================================================== */

        .sand {
            position: absolute;

            left: 0;
            bottom: 0;

            width: 100%;
            height: 20%;

            background:
                radial-gradient(circle at 20% 30%,
                    #fff8 0 2px,
                    transparent 3px),
                radial-gradient(circle at 70% 60%,
                    #fff6 0 2px,
                    transparent 3px),
                linear-gradient(to bottom,
                    #b59555,
                    #6c4f21);

            z-index: 10;
        }


        /* =====================================================
   ĐÁ
===================================================== */

        .rock {
            position: absolute;

            bottom: 16%;

            width: 90px;
            height: 45px;

            border-radius:
                55% 45% 40% 50%;

            background:
                linear-gradient(to bottom,
                    #777,
                    #3d3d3d);

            box-shadow:
                inset -8px -5px 10px rgba(0, 0, 0, .4),
                0 3px 5px rgba(0, 0, 0, .4);

            z-index: 15;
        }

        .rock1 {
            left: 8%;
        }

        .rock2 {
            left: 70%;
            width: 110px;
            height: 50px;
        }

        .rock3 {
            left: 45%;
            width: 60px;
            height: 35px;
        }


        /* =====================================================
   RONG BIỂN
===================================================== */

        .seaweed {
            position: absolute;

            bottom: 17%;

            width: 12px;
            height: 100px;

            border-radius: 100%;

            background:
                linear-gradient(to right,
                    #14532d,
                    #22c55e,
                    #14532d);

            transform-origin: bottom;

            z-index: 12;

            animation:
                sway 3s ease-in-out infinite alternate;
        }

        .seaweed1 {
            left: 15%;
            height: 90px;
        }

        .seaweed2 {
            left: 18%;
            height: 120px;
            animation-delay: .5s;
        }

        .seaweed3 {
            left: 78%;
            height: 110px;
            animation-delay: 1s;
        }

        .seaweed4 {
            left: 82%;
            height: 80px;
            animation-delay: 1.5s;
        }

        @keyframes sway {

            from {
                transform: rotate(-5deg);
            }

            to {
                transform: rotate(8deg);
            }
        }


        /* =====================================================
   BONG BÓNG
===================================================== */

        .bubble {
            position: absolute;

            bottom: 18%;

            width: 10px;
            height: 10px;

            border: 2px solid white;
            border-radius: 50%;

            z-index: 25;

            animation:
                bubbleUp 4s linear infinite;
        }

        .bubble1 {
            left: 18%;
        }

        .bubble2 {
            left: 21%;
            animation-delay: 1s;
        }

        .bubble3 {
            left: 76%;
            animation-delay: .5s;
        }

        .bubble4 {
            left: 80%;
            animation-delay: 1.5s;
        }

        @keyframes bubbleUp {

            0% {
                transform: translateY(0);
                opacity: 0;
            }

            15% {
                opacity: .8;
            }

            100% {
                transform: translateY(-400px);
                opacity: 0;
            }
        }


        /* =====================================================
   CÁ
===================================================== */

        .fish {
            position: absolute;

            z-index: 20;

            animation-timing-function: linear;
            animation-iteration-count: infinite;
            animation-play-state: running;

            pointer-events: none;
        }


        /*
   Khung bên trong dùng cho moi.js.

   KHÔNG dùng scaleX ở đây.
*/

        .fish-direction {
            width: 100%;
            height: 100%;

            transform-origin: center;
        }

        .fish-direction img {
            display: block;
            width: 100%;
            height: auto;
        }


        /* =====================================================
   KÍCH THƯỚC CÁ
===================================================== */

        .big img {
            width: 250px;
            height: 140px;
        }

        .medium img {
            width: 180px;
            height: 110px;
        }

        .small img {
            width: 120px;
            height: 70px;
        }


        /* =====================================================
   ROUTE
===================================================== */

        .route1 {
            animation-name: Shark1;
        }

        .route2 {
            animation-name: Shark2;
        }

        .route3 {
            animation-name: Shark3;
        }

        .route4 {
            animation-name: Shark4;
        }

        .route5 {
            animation-name: Shark5;
        }


        /* =====================================================
   TỐC ĐỘ
===================================================== */

        .speed1 {
            animation-duration: 10s;
        }

        .speed2 {
            animation-duration: 15s;
        }

        .speed3 {
            animation-duration: 20s;
        }

        .speed4 {
            animation-duration: 25s;
        }

        .speed5 {
            animation-duration: 30s;
        }

        .speed6 {
            animation-duration: 35s;
        }


        /* =====================================================
   QUỸ ĐẠO 1
   Trái → phải → lên → trái → về
===================================================== */

        @keyframes Shark1 {

            0% {
                left: 3%;
                top: 65%;
            }

            20% {
                left: 45%;
                top: 65%;
            }

            35% {
                left: 82%;
                top: 65%;
            }

            55% {
                left: 65%;
                top: 25%;
            }

            70% {
                left: 35%;
                top: 20%;
            }

            85% {
                left: 15%;
                top: 35%;
            }

            100% {
                left: 3%;
                top: 65%;
            }
        }


        /* =====================================================
   QUỸ ĐẠO 2
   Trái trên → giữa → phải → xuống → trái
===================================================== */

        @keyframes Shark2 {

            0% {
                left: 3%;
                top: 20%;
            }

            18% {
                left: 30%;
                top: 35%;
            }

            35% {
                left: 78%;
                top: 25%;
            }

            55% {
                left: 70%;
                top: 60%;
            }

            72% {
                left: 40%;
                top: 48%;
            }

            88% {
                left: 15%;
                top: 35%;
            }

            100% {
                left: 3%;
                top: 20%;
            }
        }


        /* =====================================================
   QUỸ ĐẠO 3
   Đường chéo / vòng lớn
===================================================== */

        @keyframes Shark3 {

            0% {
                left: 5%;
                top: 65%;
            }

            20% {
                left: 35%;
                top: 55%;
            }

            38% {
                left: 80%;
                top: 35%;
            }

            55% {
                left: 65%;
                top: 15%;
            }

            72% {
                left: 35%;
                top: 25%;
            }

            88% {
                left: 15%;
                top: 45%;
            }

            100% {
                left: 5%;
                top: 65%;
            }
        }


        /* =====================================================
   QUỸ ĐẠO 4
   PHẢI → TRÁI
===================================================== */

        @keyframes Shark4 {

            0% {
                left: 80%;
                top: 35%;
            }

            20% {
                left: 55%;
                top: 35%;
            }

            38% {
                left: 30%;
                top: 35%;
            }

            50% {
                left: 5%;
                top: 35%;
            }

            65% {
                left: 25%;
                top: 60%;
            }

            80% {
                left: 60%;
                top: 55%;
            }

            100% {
                left: 80%;
                top: 35%;
            }
        }


        /* =====================================================
   QUỸ ĐẠO 5
   PHẢI → TRÁI → LÊN → XUỐNG
===================================================== */

        @keyframes Shark5 {

            0% {
                left: 80%;
                top: 55%;
            }

            18% {
                left: 65%;
                top: 20%;
            }

            35% {
                left: 30%;
                top: 30%;
            }

            52% {
                left: 10%;
                top: 55%;
            }

            68% {
                left: 35%;
                top: 65%;
            }

            82% {
                left: 70%;
                top: 40%;
            }

            90% {
                left: 85%;
                top: 20%;
            }

            100% {
                left: 80%;
                top: 55%;
            }
        }


        /* =====================================================
   MỒI XEM TRƯỚC
===================================================== */

        .bait-preview {
            position: absolute;

            width: 16px;
            height: 16px;

            background: #8b4513;
            border: 2px solid #5c2d0c;
            border-radius: 50%;

            pointer-events: none;

            z-index: 50;

            transform:
                translate(-50%, -50%);

            opacity: .65;
        }


        /* =====================================================
   MỒI THẬT
===================================================== */

        .bait {
            position: absolute;

            width: 18px;
            height: 18px;

            background: #8b4513;
            border: 2px solid #5c2d0c;

            border-radius: 50%;

            z-index: 50;

            transform:
                translate(-50%, -50%);

            box-shadow:
                0 0 5px rgba(255, 200, 80, .8);
        }


        /* =====================================================
   TÊN
===================================================== */

        #name-banner {
            height: 10vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(to bottom,
                    #176b91,
                    #0b3f5a);

            color: white;

            font-size: 22px;
            font-weight: bold;

            letter-spacing: 1px;

            border-top:
                3px solid #5ddcff;

            box-shadow:
                0 -5px 15px rgba(47, 168, 226, .4);
        }


        /* =====================================================
   MOBILE
===================================================== */

        @media(max-width:700px) {

            #cuon {
                width: 100%;
            }

            #aquarium {
                width: 96%;
                height: 80vh;
            }

            #control-panel {
                justify-content: center;
                min-height: auto;
            }

            #control-panel button {
                font-size: 13px;
                padding: 8px 12px;
            }

            .big img {
                width: 180px;
                height: auto;
            }

            .medium img {
                width: 140px;
                height: auto;
            }

            .small img {
                width: 100px;
                height: auto;
            }
        }
    </style>
</head>


<body>

    <div id="cuon">


        <!-- =================================================
         NÚT
    ================================================= -->

        <div id="control-panel">

            <button id="musicBtn" onclick="toggleMusic()">
                🎵 Âm thanh
            </button>

            <button id="musicChangeBtn" onclick="changeMusic()">
                🎶 Đổi nhạc
            </button>

            <button id="bgBtn" onclick="changeBackground()">
                🌊 Đổi background
            </button>

            <button id="foodBtn" onclick="toggleFeedMode()">
                🍖 Cho cá ăn
            </button>

        </div>


        <!-- =================================================
         HỒ CÁ
    ================================================= -->

        <div id="aquarium">

            <div class="tank-bg"></div>

            <div class="sand"></div>


            <!-- ĐÁ -->

            <div class="rock rock1"></div>
            <div class="rock rock2"></div>
            <div class="rock rock3"></div>


            <!-- RONG -->

            <div class="seaweed seaweed1"></div>
            <div class="seaweed seaweed2"></div>
            <div class="seaweed seaweed3"></div>
            <div class="seaweed seaweed4"></div>


            <!-- BONG BÓNG -->

            <div class="bubble bubble1"></div>
            <div class="bubble bubble2"></div>
            <div class="bubble bubble3"></div>
            <div class="bubble bubble4"></div>


            <!-- =================================================
             CÁ
        ================================================= -->


            <!-- CÁ 1 -->

            <div class="fish medium route1 speed1">

                <div class="fish-direction">

                    <img src="images/shark1.gif" alt="Cá 1">

                </div>

            </div>


            <!-- CÁ 2 -->

            <div class="fish medium route5 speed1">

                <div class="fish-direction">

                    <img src="images/shark2.gif" alt="Cá 2">

                </div>

            </div>


            <!-- CÁ 3 -->

            <div class="fish small route3 speed6">

                <div class="fish-direction">

                    <img src="images/shark3.gif" alt="Cá 3">

                </div>

            </div>


            <!-- CÁ 4 -->

            <div class="fish big route4 speed2">

                <div class="fish-direction">

                    <img src="images/shark4.gif" alt="Cá 4">

                </div>

            </div>


            <!-- CÁ 5 -->

            <div class="fish medium route3 speed2">

                <div class="fish-direction">

                    <img src="images/shark5.gif" alt="Cá 5">

                </div>

            </div>


            <!-- CÁ 6 -->

            <div class="fish small route2 speed3">

                <div class="fish-direction">

                    <img src="images/shark6.gif" alt="Cá 6">

                </div>

            </div>


            <!-- CÁ 7 -->

            <div class="fish medium route5 speed4">

                <div class="fish-direction">

                    <img src="images/shark3.gif" alt="Cá 7">

                </div>

            </div>


            <!-- CÁ 8 -->

            <div class="fish medium route3 speed1">

                <div class="fish-direction">

                    <img src="images/shark4.gif" alt="Cá 8">

                </div>

            </div>

        </div>


        <!-- =================================================
         TÊN
    ================================================= -->

        <div id="name-banner">

            🐋 Nguyễn Đỗ Diệu Hiền 🐋

        </div>

    </div>


    <!-- =================================================
     ÂM THANH
================================================= -->

    <audio id="bgm" loop>

        <source src="s1.mp3" type="audio/mpeg">

    </audio>


    <!-- =================================================
     JAVASCRIPT
================================================= -->

    <script src="nut.js"></script>
    <script src="moi.js"></script>

</body>

</html>
