<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Ocean Aquarium</title>

    <style>
        /* =========================
           CÀI ĐẶT CHUNG
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            background: #111;
            display: flex;
            justify-content: center;
            overflow-x: hidden;
        }


        /* =========================
           KHUNG MÀN HÌNH
        ========================= */

        #cuon {
            width: 96vw;
            min-height: 100vh;
            background: #000;
            overflow-y: auto;
            overflow-x: hidden;
            box-shadow: 0 0 30px rgba(0, 0, 0, .7);
        }


        /* =========================
           KHU VỰC NÚT
        ========================= */

        #control-panel {
            width: 100%;
            height: 23.33vh;
            background: #111;

            display: flex;
            justify-content: flex-end;
            align-items: flex-start;
            gap: 10px;

            padding: 20px;
        }


        /* Nút âm thanh */

        #musicBtn {
            padding: 12px 20px;
            border: 0;
            border-radius: 10px;

            background: #075985;
            color: white;

            font-size: 16px;
            cursor: pointer;
        }


        /* Nút đổi background */

        #bgBtn {
            padding: 10px 16px;

            border: 2px solid #5ddcff;
            border-radius: 10px;

            background: #176b91;
            color: white;

            cursor: pointer;
            font-size: 15px;
        }

        #bgBtn:hover {
            background: #238bb5;
        }


        /* Nút đổi nhạc */

        #musicChangeBtn {
            padding: 10px 16px;

            border: 2px solid #5ddcff;
            border-radius: 10px;

            background: #176b91;
            color: white;

            cursor: pointer;
            font-size: 15px;
        }

        #musicChangeBtn:hover {
            background: #238bb5;
        }


        /* Nút cho cá ăn */

        #foodBtn {
            padding: 10px 16px;

            border: 2px solid #ffd966;
            border-radius: 10px;

            background: #d99a16;
            color: white;

            cursor: pointer;
            font-size: 15px;
        }

        #foodBtn:hover {
            background: #f0b429;
        }

        #foodBtn.active {
            background: #f0b429;
            box-shadow: 0 0 12px rgba(255, 217, 102, .8);
        }


        /* =========================
           HỒ CÁ
        ========================= */

        #aquarium {
            width: 96%;
            height: 100vh;

            margin: 0 auto;

            position: relative;
            overflow: hidden;

            border: 12px solid #9de8ff;
            border-radius: 22px;

            box-shadow:
                0 0 0 4px rgba(255, 255, 255, .25),
                0 0 30px rgba(0, 180, 255, .5),
                inset 0 0 25px rgba(255, 255, 255, .2);
        }


        /* =========================
           BACKGROUND HỒ CÁ
        ========================= */

        .tank-bg {
            position: absolute;

            inset: 0;

            background-image: url("images/bg1.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            z-index: 0;
        }


        /* =========================
           CÁT ĐÁY HỒ
        ========================= */

        .sand {
            position: absolute;

            left: 0;
            bottom: 0;

            width: 100%;
            height: 20%;

            background:
                radial-gradient(circle at 20% 30%,
                    #fff8 0 2px,
                    transparent 3px),
                radial-gradient(circle at 70% 60%,
                    #fff6 0 2px,
                    transparent 3px),
                linear-gradient(to bottom,
                    #b59555,
                    #6c4f21);

            z-index: 1;
        }


        /* =========================
           CÁ
        ========================= */

        .fish {
            position: absolute;

            animation-timing-function: linear;
            animation-iteration-count: infinite;
            animation-play-state: running;

            transform: scaleX(1);

            z-index: 2;
        }


        /* Kích thước cá */

        .big img {
            width: 250px;
            height: 140px;
        }

        .medium img {
            width: 180px;
            height: 110px;
        }

        .small img {
            width: 120px;
            height: 70px;
        }

        .mini img {
            width: 80px;
            height: 50px;
        }


        /* =========================
           ĐƯỜNG ĐI CỦA CÁ
        ========================= */

        .route1 {
            animation-name: Shark1;
        }

        .route2 {
            animation-name: Shark2;
        }

        .route3 {
            animation-name: Shark3;
        }

        .route4 {
            animation-name: Shark4;
        }

        .route5 {
            animation-name: Shark5;
        }


        /* =========================
           TỐC ĐỘ CÁ
        ========================= */

        .speed1 {
            animation-duration: 8s;
        }

        .speed2 {
            animation-duration: 12s;
        }

        .speed3 {
            animation-duration: 15s;
        }

        .speed4 {
            animation-duration: 18s;
        }

        .speed5 {
            animation-duration: 20s;
        }

        .speed6 {
            animation-duration: 25s;
        }


        @keyframes Shark1{
    0%{left:30px;top:65%;transform:scaleX(1);}
    20%{left:45%;top:65%;transform:scaleX(1);}
    35%{left:85%;top:65%;transform:scaleX(1);}
    35.0001%{left:85%;top:65%;transform:scaleX(-1);}
    60%{left:60%;top:20%;transform:scaleX(-1);}
    70%{left:35%;top:20%;transform:scaleX(-1);}
    99.999%{left:30px;top:65%;transform:scaleX(-1);}
    100%{left:30px;top:65%;transform:scaleX(1);}
}


@keyframes Shark2{
    0%{left:30px;top:20%;transform:scaleX(1);}
    20%{left:35%;top:40%;transform:scaleX(1);}
    35%{left:80%;top:30%;transform:scaleX(1);}
    35.0001%{left:80%;top:30%;transform:scaleX(-1);}
    60%{left:65%;top:65%;transform:scaleX(-1);}
    70%{left:35%;top:45%;transform:scaleX(-1);}
    99.999%{left:30px;top:20%;transform:scaleX(-1);}
    100%{left:30px;top:20%;transform:scaleX(1);}
}


@keyframes Shark3{
    0%{left:50px;top:65%;transform:scaleX(1);}
    20%{left:35%;top:55%;transform:scaleX(1);}
    35%{left:80%;top:35%;transform:scaleX(1);}
    35.0001%{left:80%;top:35%;transform:scaleX(-1);}
    60%{left:65%;top:15%;transform:scaleX(-1);}
    70%{left:35%;top:25%;transform:scaleX(-1);}
    99.999%{left:50px;top:65%;transform:scaleX(-1);}
    100%{left:50px;top:65%;transform:scaleX(1);}
}


@keyframes Shark4{
    0%{left:80%;top:35%;transform:scaleX(-1);}
    20%{left:30px;top:35%;transform:scaleX(-1);}
    35%{left:30px;top:35%;transform:scaleX(-1);}
    35.0001%{left:30px;top:35%;transform:scaleX(1);}
    60%{left:30%;top:65%;transform:scaleX(1);}
    70%{left:65%;top:55%;transform:scaleX(1);}
    99.999%{left:80%;top:35%;transform:scaleX(1);}
    100%{left:80%;top:35%;transform:scaleX(-1);}
}


@keyframes Shark5{
    0%{left:80%;top:55%;transform:scaleX(-1);}
    20%{left:65%;top:15%;transform:scaleX(-1);}
    35%{left:30%;top:30%;transform:scaleX(-1);}
    35.0001%{left:30%;top:30%;transform:scaleX(1);}
    60%{left:55%;top:65%;transform:scaleX(1);}
    75%{left:75%;top:40%;transform:scaleX(1);}
    80%{left:85%;top:20%;transform:scaleX(1);}
    99.999%{left:80%;top:55%;transform:scaleX(1);}
    100%{left:80%;top:55%;transform:scaleX(-1);}
}
        /* =========================
           MỒI XEM TRƯỚC
        ========================= */

        .bait-preview {
            position: absolute;

            width: 16px;
            height: 16px;

            background: #8b4513;
            border: 2px solid #5c2d0c;

            border-radius: 50%;

            pointer-events: none;
            z-index: 50;

            transform: translate(-50%, -50%);

            opacity: .65;
        }


        /* =========================
           MỒI THẬT
        ========================= */

        .bait {
            position: absolute;

            width: 18px;
            height: 18px;

            background: #8b4513;
            border: 2px solid #5c2d0c;

            border-radius: 50%;

            z-index: 10;

            transform: translate(-50%, -50%);

            box-shadow: 0 0 5px rgba(255, 200, 80, .8);
        }


        /* =========================
           TÊN
        ========================= */

        #name-banner {
            height: 10vh;

            background: linear-gradient(to bottom,
                    #176b91,
                    #0b3f5a);

            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 22px;
            font-weight: bold;
            letter-spacing: 1px;

            border-top: 3px solid #5ddcff;

            box-shadow:
                0 -5px 15px rgba(47, 168, 226, .4);
        }


        /* =========================
           MÀN HÌNH NHỎ
        ========================= */

        @media(max-width:700px) {

            #cuon {
                width: 100%;
            }

            #aquarium {
                width: 96%;
            }

            #control-panel {
                flex-wrap: wrap;
            }

        }
    </style>
</head>


<body>

    <div id="cuon">


        <!-- =========================
             KHU VỰC NÚT
        ========================= -->

        <div id="control-panel">

            <button id="musicBtn" onclick="toggleMusic()">
                🎵 Âm thanh
            </button>

            <button id="musicChangeBtn" onclick="changeMusic()">
                🎶 Đổi nhạc
            </button>

            <button id="bgBtn" onclick="changeBackground()">
                🌊 Đổi background
            </button>

            <button id="foodBtn" onclick="toggleFeedMode()">
                🍖 Cho cá ăn
            </button>

        </div>


        <!-- =========================
             HỒ CÁ
        ========================= -->

        <div id="aquarium">

            <div class="tank-bg"></div>

            <div class="sand"></div>

        <div class="fish medium route1 speed1"><img src="images/shark1.gif" alt="1"></div>
        <div class="fish medium route5 speed1"><img src="images/shark2.gif" alt="2"></div>
        <div class="fish small route3 speed6"><img src="images/shark3.gif" alt="3"></div>
        <div class="fish big route4 speed2"><img src="images/shark4.gif" alt="4"></div>
        <div class="fish medium route3 speed2"><img src="images/shark5.gif" alt="1"></div>
        <div class="fish small route2 speed3"><img src="images/shark6.gif" alt="2"></div>
        <div class="fish medium route5 speed4"><img src="images/shark3.gif" alt="3"></div>
        <div class="fish small route3 speed1"><img src="images/shark4.gif" alt="4"></div>
        </div>


        <!-- =========================
             TÊN
        ========================= -->

        <div id="name-banner">
            🐋 Nguyễn Đỗ Diệu Hiền 🐋
        </div>

    </div>


    <!-- =========================
         ÂM THANH
    ========================= -->

    <audio id="bgm" loop>
        <source src="s1.mp3" type="audio/mpeg">
    </audio>


    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script src="nut.js"></script>
    <script src="moi.js"></script>

</body>

</html>
